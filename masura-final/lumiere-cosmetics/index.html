<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masura — Каталог</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body style="background:var(--color-white);color:var(--color-text)">

  <header id="site-nav" class="nav" role="banner"></header>

  <main>
    <div class="container">
      <div class="catalog-header">
        <h1 class="catalog-header__title">Каталог</h1>
      </div>

      <div class="catalog-filters-wrap" id="catalog-filters">
        <div class="loading" style="padding:12px 0"><div class="spinner"></div></div>
      </div>

      <div class="catalog-search-wrap">
        <input type="search" id="catalog-search" placeholder="Поиск по названию, цвету, эффекту..." oninput="filterProducts()">
      </div>

      <div class="product-grid" id="product-grid">
        <div class="loading" style="grid-column:1/-1;padding:80px 0"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <!-- Product Modal -->
  <div id="product-modal" class="product-modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="product-modal">
      <div class="product-modal__image-wrap" id="modal-image-wrap">
        <img id="modal-image" src="" alt="" class="product-modal__image" style="display:none">
        <div id="modal-placeholder" class="product-modal__placeholder"></div>
      </div>
      <div class="product-modal__content">
        <button class="product-modal__close" onclick="closeModal()">×</button>
        <h2 id="modal-name" class="product-modal__name"></h2>
        <div id="modal-price" class="product-modal__price"></div>
        <p id="modal-desc" class="product-modal__desc"></p>
        <button id="modal-add-btn" class="product-modal__add-btn" onclick="modalAddToCart()">В корзину</button>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/cart.js"></script>

  <script>
    var currentModalProduct = null;

    function closeModal() {
      document.getElementById('product-modal').classList.remove('open');
    }

    function openProductModal(id) {
      var p = (window._allProducts || []).find(function(x){ return x.id === id; });
      if (!p) return;
      currentModalProduct = p;
      document.getElementById('modal-name').textContent = p.name || '';
      document.getElementById('modal-desc').textContent = p.description || '';
      document.getElementById('modal-price').textContent = Number(p.price).toLocaleString('ru-RU') + ' ₽';
      var img = document.getElementById('modal-image');
      var ph  = document.getElementById('modal-placeholder');
      if (p.image) {
        img.src = p.image; img.style.display = 'block'; ph.style.display = 'none';
      } else {
        img.style.display = 'none'; ph.style.display = 'flex';
        ph.textContent = p.emoji || '✦';
      }
      var btn = document.getElementById('modal-add-btn');
      btn.textContent = 'В корзину';
      btn.style.background = '';
      document.getElementById('product-modal').classList.add('open');
    }

    function modalAddToCart() {
      if (!currentModalProduct) return;
      Cart.add(currentModalProduct);
      var btn = document.getElementById('modal-add-btn');
      btn.textContent = '✓ Добавлено';
      btn.style.background = '#555';
    }

    function addToCartFromCard(id, event) {
      event.stopPropagation();
      var p = (window._allProducts || []).find(function(x){ return x.id === id; });
      if (!p) return;
      Cart.add(p);
      var btn = event.currentTarget;
      btn.textContent = '✓';
      btn.style.background = '#111';
      btn.style.color = '#fff';
      setTimeout(function() {
        btn.textContent = 'В корзину';
        btn.style.background = '';
        btn.style.color = '';
      }, 1500);
    }
  </script>

  <script type="module">
    import { getActiveProducts, getCategories } from './js/db.js';

    renderNav('catalog');

    async function init() {
      const [products, categories] = await Promise.all([getActiveProducts(), getCategories()]);
      renderFilters(categories);
      renderProducts(products, categories, 'all');
    }

    function renderFilters(categories) {
      const container = document.getElementById('catalog-filters');
      const all = [{ id: 'all', label: 'Все' }, ...categories];
      container.innerHTML = all.map(c =>
        `<button class="filter-btn ${c.id === 'all' ? 'active' : ''}" data-category="${c.id}">${c.label}</button>`
      ).join('');

      container.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.category;
        const filtered = cat === 'all'
          ? window._allProducts
          : window._allProducts.filter(p => Array.isArray(p.categories) ? p.categories.includes(cat) : p.category === cat);
        renderProducts(filtered, window._allCategories, cat, true);
      });
    }

    window.filterProducts = function() {
      const q = (document.getElementById('catalog-search')?.value || '').toLowerCase().trim();
      const cat = document.querySelector('.filter-btn.active')?.dataset.category || 'all';
      let filtered = window._allProducts || [];
      if (cat !== 'all') {
        filtered = filtered.filter(p => Array.isArray(p.categories) ? p.categories.includes(cat) : p.category === cat);
      }
      if (q) {
        filtered = filtered.filter(p =>
          [p.name, p.description, p.color, p.effect, p.productType]
            .map(v => (v || '').toLowerCase()).some(f => f.includes(q))
        );
      }
      renderProducts(filtered, window._allCategories, cat, true);
    };

    function renderProducts(products, categories, activeCategory, skipStore) {
      if (!skipStore) {
        window._allProducts   = products;
        window._allCategories = categories;
      }
      const grid = document.getElementById('product-grid');
      if (!products || products.length === 0) {
        grid.innerHTML = '<p class="catalog-empty">Товары не найдены</p>';
        return;
      }
      const getCatLabel = id => (categories || []).find(c => c.id === id)?.label || '';
      grid.innerHTML = products.map(p => `
        <article class="product-card" onclick="openProductModal('${p.id}')">
          ${p.badge ? `<span class="product-card__badge ${p.badge === 'New' ? 'product-card__badge--new' : ''}">${p.badge}</span>` : ''}
          <div class="product-card__image-wrap">
            ${p.image ? `<img class="product-card__image" src="${p.image}" alt="${p.name}" loading="lazy">` : ''}
            <div class="product-card__image-placeholder" style="${p.image ? 'display:none' : ''}">${p.emoji || ''}</div>
            <div class="product-card__overlay">
              <button class="product-card__quick-add" onclick="addToCartFromCard('${p.id}', event)">В корзину</button>
            </div>
          </div>
          <div class="product-card__info">
            <p class="product-card__category">${getCatLabel(p.category)}</p>
            <h3 class="product-card__name">${p.name}</h3>
            <div class="product-card__price">${Number(p.price).toLocaleString('ru-RU')} ₽</div>
          </div>
        </article>
      `).join('');
    }

    init();
  </script>

</body>
</html>
