<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход — Masura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; font-family: 'DM Sans', sans-serif; }
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .auth-box { width: 100%; max-width: 400px; }
    .auth-logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; text-align: center; margin-bottom: 8px; text-decoration: none; color: #111; display: block; }
    .auth-subtitle { text-align: center; font-size: 12px; letter-spacing: 0.08em; color: #999; text-transform: uppercase; margin-bottom: 40px; }
    .auth-tabs { display: flex; border-bottom: 1px solid #e8e8e8; margin-bottom: 32px; }
    .auth-tab { flex: 1; text-align: center; padding: 12px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; background: none; border-left: none; border-right: none; border-top: none; font-family: 'DM Sans', sans-serif; }
    .auth-tab.active { color: #111; border-bottom-color: #111; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-field { margin-bottom: 20px; }
    .auth-field label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 8px; }
    .auth-field input { width: 100%; border: none; border-bottom: 1px solid #e8e8e8; padding: 10px 0; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #111; outline: none; background: transparent; transition: border-color 0.15s; }
    .auth-field input:focus { border-color: #111; }
    .auth-btn { width: 100%; background: #111; color: #fff; border: none; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; padding: 16px; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    .auth-btn:hover { background: #333; }
    .auth-divider { text-align: center; font-size: 11px; color: #ccc; margin: 20px 0; position: relative; }
    .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #e8e8e8; }
    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }
    .auth-google-btn { width: 100%; background: #fff; color: #111; border: 1px solid #e8e8e8; font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: border-color 0.15s; }
    .auth-google-btn:hover { border-color: #111; }
    .auth-error { font-size: 12px; color: #c00; margin-top: 12px; text-align: center; min-height: 18px; }
    .auth-back { display: block; text-align: center; margin-top: 24px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa; text-decoration: none; transition: color 0.15s; }
    .auth-back:hover { color: #111; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <a href="../index.html" class="auth-logo">Masura</a>
    <p class="auth-subtitle">Личный кабинет</p>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Вход</button>
      <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div class="auth-form active" id="form-login">
      <div class="auth-field"><label>Email</label><input type="email" id="login-email" placeholder="your@email.com" autocomplete="email"></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="auth-btn" onclick="loginWithEmail()">Войти</button>
      <div class="auth-divider">или</div>
      <button class="auth-google-btn" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Войти через Google
      </button>
      <p class="auth-error" id="login-error"></p>
    </div>

    <div class="auth-form" id="form-register">
      <div class="auth-field"><label>Имя</label><input type="text" id="reg-name" placeholder="Ваше имя"></div>
      <div class="auth-field"><label>Email</label><input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email"></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="reg-password" placeholder="Минимум 6 символов" autocomplete="new-password"></div>
      <button class="auth-btn" onclick="registerWithEmail()">Создать аккаунт</button>
      <div class="auth-divider">или</div>
      <button class="auth-google-btn" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Зарегистрироваться через Google
      </button>
      <p class="auth-error" id="reg-error"></p>
    </div>

    <a href="../index.html" class="auth-back">← Вернуться в каталог</a>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(function(t, i) {
      t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1));
    });
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-register').classList.toggle('active', tab === 'register');
  }
</script>

<script type="module">
  import { auth, db } from '../js/firebase-config.js';
  import { signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { doc, setDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  onAuthStateChanged(auth, function(user) {
    if (user) window.location.href = 'profile.html';
  });

  async function createUserDoc(user, name) {
    const ref = doc(db, 'users', user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { email: user.email, name: name || user.displayName || '', discount: 0, createdAt: serverTimestamp(), cart: [] });
    }
  }

  window.loginWithEmail = async function() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    const err   = document.getElementById('login-error');
    err.textContent = '';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      err.textContent = e.code === 'auth/invalid-credential' ? 'Неверный email или пароль' : 'Ошибка входа';
    }
  };

  window.registerWithEmail = async function() {
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass  = document.getElementById('reg-password').value;
    const err   = document.getElementById('reg-error');
    err.textContent = '';
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      if (name) await updateProfile(cred.user, { displayName: name });
      await createUserDoc(cred.user, name);
    } catch(e) {
      err.textContent = e.code === 'auth/email-already-in-use' ? 'Email уже используется' :
                        e.code === 'auth/weak-password' ? 'Пароль слишком короткий' : 'Ошибка регистрации';
    }
  };

  window.loginWithGoogle = async function() {
    try {
      const provider = new GoogleAuthProvider();
      const cred = await signInWithPopup(auth, provider);
      await createUserDoc(cred.user, '');
    } catch(e) {
      document.getElementById('login-error').textContent = 'Ошибка входа через Google';
    }
  };
</script>

</body>
</html>
