<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход — Masura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; font-family: 'DM Sans', sans-serif; }
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .auth-box { width: 100%; max-width: 400px; }
    .auth-logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; text-align: center; margin-bottom: 8px; text-decoration: none; color: #111; display: block; }
    .auth-subtitle { text-align: center; font-size: 12px; letter-spacing: 0.08em; color: #999; text-transform: uppercase; margin-bottom: 40px; }
    .auth-tabs { display: flex; border-bottom: 1px solid #e8e8e8; margin-bottom: 32px; }
    .auth-tab { flex: 1; text-align: center; padding: 12px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; background: none; border-left: none; border-right: none; border-top: none; font-family: 'DM Sans', sans-serif; }
    .auth-tab.active { color: #111; border-bottom-color: #111; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-field { margin-bottom: 20px; }
    .auth-field label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 8px; }
    .auth-field input { width: 100%; border: none; border-bottom: 1px solid #e8e8e8; padding: 10px 0; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #111; outline: none; background: transparent; transition: border-color 0.15s; }
    .auth-field input:focus { border-color: #111; }
    .auth-btn { width: 100%; background: #111; color: #fff; border: none; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; padding: 16px; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    .auth-btn:hover { background: #333; }
    .auth-error { font-size: 12px; margin-top: 12px; text-align: center; min-height: 18px; color: #c00; }
    .auth-link-btn { background: none; border: none; font-family: 'DM Sans', sans-serif; font-size: 12px; color: #aaa; cursor: pointer; text-decoration: underline; letter-spacing: 0.05em; display: block; margin: 12px auto 0; }
    .auth-back { display: block; text-align: center; margin-top: 24px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa; text-decoration: none; }
    .auth-back:hover { color: #111; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <a href="../index.html" class="auth-logo">Masura</a>
    <p class="auth-subtitle">Личный кабинет</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Вход</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div class="auth-form active" id="form-login">
      <div class="auth-field"><label>Email</label><input type="email" id="login-email" placeholder="your@email.com" autocomplete="email"></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="auth-btn" id="btn-login">Войти</button>
      <button class="auth-link-btn" id="btn-reset">Забыли пароль?</button>
      <p class="auth-error" id="login-error"></p>
    </div>

    <div class="auth-form" id="form-register">
      <div class="auth-field"><label>Имя</label><input type="text" id="reg-name" placeholder="Ваше имя" autocomplete="name"></div>
      <div class="auth-field"><label>Email</label><input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email"></div>
      <div class="auth-field"><label>Пароль (минимум 6 символов)</label><input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password"></div>
      <button class="auth-btn" id="btn-register">Создать аккаунт</button>
      <p class="auth-error" id="reg-error"></p>
    </div>

    <a href="../index.html" class="auth-back">← Вернуться в каталог</a>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').classList.toggle('active', tab === 'login');
  document.getElementById('form-register').classList.toggle('active', tab === 'register');
}
</script>

<script type="module">
import { auth, db } from '../js/firebase-config.js';
import {
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged,
  updateProfile
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  doc, setDoc, getDoc, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// Redirect if already logged in
onAuthStateChanged(auth, function(user) {
  if (user) window.location.href = 'profile.html';
});

async function createUserDoc(user, name) {
  try {
    const ref = doc(db, 'users', user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        email: user.email,
        name: name || user.displayName || '',
        discount: 0,
        createdAt: serverTimestamp(),
        cart: []
      });
    }
  } catch(e) {
    console.error('createUserDoc error:', e.code, e.message);
  }
}

document.getElementById('btn-login').addEventListener('click', async function() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const err   = document.getElementById('login-error');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Введите email и пароль'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' ? 'Неверный email или пароль' : 'Ошибка входа';
  }
});

document.getElementById('btn-register').addEventListener('click', async function() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-password').value;
  const err   = document.getElementById('reg-error');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Введите email и пароль'; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    if (name) await updateProfile(cred.user, { displayName: name });
    await createUserDoc(cred.user, name);
  } catch(e) {
    err.textContent = e.code === 'auth/email-already-in-use' ? 'Email уже используется' :
                      e.code === 'auth/weak-password' ? 'Пароль минимум 6 символов' : 'Ошибка регистрации';
  }
});

document.getElementById('btn-reset').addEventListener('click', async function() {
  const email = document.getElementById('login-email').value.trim();
  const err   = document.getElementById('login-error');
  if (!email) { err.style.color = '#c00'; err.textContent = 'Введите email для сброса пароля'; return; }
  try {
    await sendPasswordResetEmail(auth, email);
    err.style.color = '#2a7a2a';
    err.textContent = '✓ Письмо со сбросом пароля отправлено';
  } catch(e) {
    err.style.color = '#c00';
    err.textContent = e.code === 'auth/user-not-found' ? 'Email не найден' : 'Ошибка';
  }
});
</script>

</body>
</html>
