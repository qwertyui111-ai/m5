<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masura — Каталог</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/catalog.css">
</head>
<body>

  <header id="site-nav" class="nav" role="banner"></header>

  <main>
    <div class="container">
      <div class="page-header">
        <p class="page-header__eyebrow">Наш ассортимент</p>
        <h1 class="page-header__title">Каталог</h1>
        <p class="page-header__subtitle">Откройте для себя косметику, созданную для настоящих ритуалов красоты</p>
      </div>

      <div style="margin-bottom:16px">
        <input type="search" id="catalog-search" placeholder="Поиск по названию, цвету, эффекту..."
          style="width:100%;padding:12px 18px;border:1.5px solid var(--color-border);border-radius:var(--radius-pill);font-family:var(--font-body);font-size:14px;background:var(--color-white);color:var(--color-espresso);outline:none;transition:border-color 0.2s"
          oninput="filterProducts()">
      </div>

      <div class="catalog-filters" id="catalog-filters" role="group" aria-label="Фильтр по категории">
        <div class="loading" style="padding:8px 0"><div class="spinner" style="width:16px;height:16px;border-width:1.5px"></div></div>
      </div>

      <div class="product-grid" id="product-grid" aria-label="Товары">
        <div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Загрузка товаров...</div>
      </div>
    </div>
  </main>

  <footer role="contentinfo">
    <div class="container">
      <div class="footer__bottom" style="border:none;padding:var(--spacing-xl) 0">
        <span style="color:rgba(0,0,0,0.4)">© 2025 Masura</span>
      </div>
    </div>
  </footer>

  <!-- Модальное окно товара -->
  <div id="product-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)this.style.display='none'">
    <div style="background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 16px;border-bottom:1px solid #E8E2DC">
        <h2 id="modal-name" style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;margin:0"></h2>
        <button onclick="document.getElementById('product-modal').style.display='none'" style="background:none;border:none;font-size:28px;cursor:pointer;color:#888;line-height:1;padding:0 4px">×</button>
      </div>
      <div style="padding:20px 24px">
        <img id="modal-image" src="" alt="" style="width:100%;border-radius:12px;margin-bottom:16px;display:none;object-fit:cover;aspect-ratio:1">
        <div id="modal-placeholder" style="width:100%;aspect-ratio:1;border-radius:12px;background:#F2EEE9;display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:16px"></div>
        <p id="modal-desc" style="font-size:14px;color:#666;line-height:1.7;margin-bottom:16px"></p>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span id="modal-price" style="font-family:'Cormorant Garamond',serif;font-size:28px"></span>
          <button id="modal-add-btn" onclick="modalAddToCart()" style="background:#1A1A1A;color:#fff;border:none;border-radius:99px;padding:12px 24px;font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer">В корзину</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/nav.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script type="module">
    import { getActiveProducts, getCategories } from '../js/db.js';

    renderNav('catalog');

    var currentModalProduct = null;

    window.modalAddToCart = function() {
      if (!currentModalProduct) return;
      Cart.add(currentModalProduct);
      var btn = document.getElementById('modal-add-btn');
      btn.textContent = '✓ Добавлено';
      btn.style.background = '#D4847A';
      setTimeout(function() {
        btn.textContent = 'В корзину';
        btn.style.background = '#1A1A1A';
      }, 1500);
    };

    window.openProductModal = function(id) {
      var p = (window._allProducts || []).find(function(x) { return x.id === id; });
      if (!p) return;
      currentModalProduct = p;
      document.getElementById('modal-name').textContent = p.name || '';
      document.getElementById('modal-desc').textContent = p.description || 'Описание отсутствует';
      document.getElementById('modal-price').textContent = Number(p.price).toLocaleString('ru-RU') + ' ₽';
      var img = document.getElementById('modal-image');
      var ph  = document.getElementById('modal-placeholder');
      if (p.image) {
        img.src = p.image; img.style.display = 'block'; ph.style.display = 'none';
      } else {
        img.style.display = 'none'; ph.style.display = 'flex';
        ph.textContent = p.emoji || '✦';
      }
      document.getElementById('product-modal').style.display = 'flex';
    };

    window.addToCartFromCard = function(id, event) {
      event.stopPropagation();
      var p = (window._allProducts || []).find(function(x) { return x.id === id; });
      if (!p) return;
      Cart.add(p);
      var btn = event.currentTarget;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
      btn.style.background = '#D4847A';
      setTimeout(function() {
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
        btn.style.background = '';
      }, 1500);
    };

    async function init() {
      const [products, categories] = await Promise.all([getActiveProducts(), getCategories()]);
      renderFilters(categories);
      renderProducts(products, categories, 'all');
    }

    function renderFilters(categories) {
      const container = document.getElementById('catalog-filters');
      const all = [{ id: 'all', label: 'Все' }, ...categories];
      container.innerHTML = all.map(c =>
        `<button class="filter-btn ${c.id === 'all' ? 'active' : ''}" data-category="${c.id}">${c.label}</button>`
      ).join('');

      container.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.category;
        const filtered = cat === 'all'
          ? window._allProducts
          : window._allProducts.filter(p => Array.isArray(p.categories) ? p.categories.includes(cat) : p.category === cat);
        renderProducts(filtered, window._allCategories, cat, true);
      });
    }

    window.filterProducts = function() {
      const q = document.getElementById('catalog-search')?.value.toLowerCase().trim() || '';
      const activeBtn = document.querySelector('.filter-btn.active');
      const cat = activeBtn?.dataset.category || 'all';
      let filtered = window._allProducts || [];
      if (cat !== 'all') {
        filtered = filtered.filter(p => Array.isArray(p.categories) ? p.categories.includes(cat) : p.category === cat);
      }
      if (q) {
        filtered = filtered.filter(p =>
          [p.name, p.description, p.color, p.effect, p.productType]
            .map(v => (v || '').toLowerCase())
            .some(f => f.includes(q))
        );
      }
      renderProducts(filtered, window._allCategories, cat, true);
    };

    function renderProducts(products, categories, activeCategory, skipStore) {
      if (!skipStore) {
        window._allProducts   = products;
        window._allCategories = categories;
      }
      const grid = document.getElementById('product-grid');
      if (!products || products.length === 0) {
        grid.innerHTML = '<p class="catalog-empty">Товары не найдены</p>';
        return;
      }
      const getCatLabel = id => (categories || []).find(c => c.id === id)?.label || id;
      grid.innerHTML = products.map(p => `
        <article class="product-card animate-fade-up" style="cursor:pointer" onclick="openProductModal('${p.id}')">
          ${p.badge ? `<span class="product-card__badge ${p.badge === 'New' ? 'product-card__badge--new' : ''}">${p.badge}</span>` : ''}
          <div class="product-card__image-wrap">
            ${p.image ? `<img class="product-card__image" src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
            <div class="product-card__image-placeholder" aria-hidden="true" style="${p.image ? 'display:none' : ''}">${p.emoji || '✦'}</div>
          </div>
          <div class="product-card__info">
            <p class="product-card__category">${getCatLabel(p.category)}</p>
            <h3 class="product-card__name">${p.name}</h3>
            <p class="product-card__desc">${p.description || ''}</p>
            <div class="product-card__footer">
              <div class="product-card__price">${Number(p.price).toLocaleString('ru-RU')} ₽</div>
              <button class="product-card__add-btn" onclick="addToCartFromCard('${p.id}', event)" aria-label="Добавить в корзину">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    init();
  </script>

</body>
</html>
