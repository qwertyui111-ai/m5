<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог — Masura</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/catalog.css">
</head>
<body>

  <header id="site-nav" class="nav" role="banner"></header>

  <main>
    <div class="container">
      <div class="page-header">
        <p class="page-header__eyebrow">Наш ассортимент</p>
        <h1 class="page-header__title">Каталог</h1>
        <p class="page-header__subtitle">Откройте для себя косметику, созданную для настоящих ритуалов красоты</p>
      </div>

      <!-- Search bar -->
      <div style="margin-bottom:16px">
        <input
          type="search"
          id="catalog-search"
          placeholder="Поиск по названию, цвету, эффекту..."
          style="width:100%;padding:12px 18px;border:1.5px solid var(--color-border);border-radius:var(--radius-pill);font-family:var(--font-body);font-size:14px;background:var(--color-white);color:var(--color-espresso);outline:none;transition:border-color 0.2s"
          oninput="filterProducts()"
        >
      </div>

      <div class="catalog-filters" id="catalog-filters" role="group" aria-label="Фильтр по категории">
        <div class="loading" style="padding:8px 0"><div class="spinner" style="width:16px;height:16px;border-width:1.5px"></div></div>
      </div>

      <div class="product-grid" id="product-grid" aria-label="Товары">
        <div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Загрузка товаров...</div>
      </div>
    </div>
  </main>

  <footer role="contentinfo">
    <div class="container">
      <div class="footer__bottom" style="border:none;padding:var(--spacing-xl) 0">
        <span style="color:rgba(255,255,255,0.5)">© 2025 Masura</span>
        <a href="../index.html" style="color:var(--color-sand);font-size:12px">На главную</a>
      </div>
    </div>
  </footer>

  <script src="../js/nav.js"></script>
  <script src="../js/cart.js"></script>

  <script type="module">
    import { getActiveProducts, getCategories } from '../js/db.js';

    // ---- Nav ----
    function initNav() {
      if (typeof window.renderNav === 'function') {
        window.renderNav('catalog');
      }
    }

    // ---- Load data ----
    async function init() {
      initNav();
      const [products, categories] = await Promise.all([getActiveProducts(), getCategories()]);

      renderFilters(categories);
      renderProducts(products, categories, 'all');
    }

    function renderFilters(categories) {
      const container = document.getElementById('catalog-filters');
      const all = [{ id: 'all', label: 'Все' }, ...categories];
      container.innerHTML = all.map(c =>
        `<button class="filter-btn ${c.id === 'all' ? 'active' : ''}" data-category="${c.id}">${c.label}</button>`
      ).join('');

      container.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.category;
          const filtered = cat === 'all'
            ? window._allProducts
            : window._allProducts.filter(p => {
                if (Array.isArray(p.categories)) return p.categories.includes(cat);
                return p.category === cat;
              });
        renderProducts(filtered, window._allCategories, btn.dataset.category);
      });
    }

    window.filterProducts = function() {
      const q = document.getElementById('catalog-search')?.value.toLowerCase().trim() || '';
      const activeBtn = document.querySelector('.filter-btn.active');
      const activeCategory = activeBtn?.dataset.category || 'all';

      let filtered = window._allProducts || [];

      // Filter by category
      if (activeCategory !== 'all') {
        filtered = filtered.filter(p => p.category === activeCategory);
      }

      // Filter by search query — name, color, effect, productType
      if (q) {
        filtered = filtered.filter(p => {
          const fields = [
            p.name, p.description, p.color,
            p.effect, p.productType
          ].map(v => (v || '').toLowerCase());
          return fields.some(f => f.includes(q));
        });
      }

      renderProducts(filtered, window._allCategories, activeCategory, true);
    };

    function renderProducts(products, categories, activeCategory, skipStore) {
      if (!skipStore) {
        window._allProducts   = products;
        window._allCategories = categories;
      }
      const grid = document.getElementById('product-grid');

      if (products.length === 0) {
        grid.innerHTML = `<p class="catalog-empty">Товары не найдены</p>`;
        return;
      }

      const getCatLabel = id => categories.find(c => c.id === id)?.label || id;

      grid.innerHTML = products.map(p => `
        <article class="product-card animate-fade-up">
          ${p.badge ? `<span class="product-card__badge ${p.badge === 'New' ? 'product-card__badge--new' : ''}">${p.badge}</span>` : ''}
          <div class="product-card__image-wrap">
            ${p.image
              ? `<img class="product-card__image" src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''
            }
            <div class="product-card__image-placeholder" aria-hidden="true" style="${p.image ? 'display:none' : ''}">${p.emoji || '✦'}</div>
          </div>
          <div class="product-card__info">
            <p class="product-card__category">${getCatLabel(p.category)}</p>
            <h3 class="product-card__name">${p.name}</h3>
            <p class="product-card__desc">${p.description || ''}</p>
            <div class="product-card__footer">
              <div class="product-card__price">${Number(p.price).toLocaleString('ru-RU')} ₽</div>
              <button class="product-card__add-btn" data-id="${p.id}" aria-label="Добавить ${p.name} в корзину">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>
        </article>
      `).join('');

      // Add to cart — pass full product data
      grid.querySelectorAll('.product-card__add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const product = (window._allProducts || []).find(p => p.id === id);
          if (typeof Cart !== 'undefined' && product) {
            Cart.add(product);
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
            btn.style.background = 'var(--color-accent)';
            setTimeout(() => {
              btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
              btn.style.background = '';
            }, 1500);
          }
        });
      });


    }

    init();
  </script>

<!-- Секретная кнопка админки -->



  
  <script>
  // Делегирование клика на карточку товара
  document.addEventListener('click', function(e) {
    const card = e.target.closest('.product-card');
    if (!card) return;
    if (e.target.closest('.product-card__add-btn')) return;
    const id = card.querySelector('.product-card__add-btn')?.dataset.id;
    const product = (window._allProducts || []).find(p => p.id === id);
    if (!product) return;
    showProductModal(product);
  });
  </script>
  <!-- Product Modal -->
  <div id="product-modal-view" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:16px">
    <div style="background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 16px;border-bottom:1px solid #E8E2DC">
        <h2 id="modal-product-name" style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400"></h2>
        <button onclick="document.getElementById('product-modal-view').style.display='none'" style="background:none;border:none;font-size:24px;cursor:pointer;color:#888;line-height:1">×</button>
      </div>
      <div style="padding:20px 24px">
        <img id="modal-product-image" src="" alt="" style="width:100%;border-radius:12px;margin-bottom:16px;display:none">
        <div id="modal-product-placeholder" style="width:100%;aspect-ratio:1;border-radius:12px;background:#F2EEE9;display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:16px"></div>
        <p id="modal-product-desc" style="font-size:14px;color:#666;line-height:1.7;margin-bottom:16px"></p>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span id="modal-product-price" style="font-family:'Cormorant Garamond',serif;font-size:28px"></span>
          <button id="modal-add-btn" style="background:#1A1A1A;color:#fff;border:none;border-radius:99px;padding:12px 24px;font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer">В корзину</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  window.showProductModal = function(p) {
    document.getElementById('modal-product-name').textContent = p.name;
    document.getElementById('modal-product-desc').textContent = p.description || 'Описание отсутствует';
    document.getElementById('modal-product-price').textContent = Number(p.price).toLocaleString('ru-RU') + ' ₽';

    const img = document.getElementById('modal-product-image');
    const placeholder = document.getElementById('modal-product-placeholder');
    if (p.image) {
      img.src = p.image; img.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      img.style.display = 'none';
      placeholder.style.display = 'flex';
      placeholder.textContent = p.emoji || '✦';
    }

    const addBtn = document.getElementById('modal-add-btn');
    addBtn.onclick = () => {
      if (typeof Cart !== 'undefined') Cart.add(p);
      addBtn.textContent = '✓ Добавлено';
      addBtn.style.background = 'var(--color-accent, #D4847A)';
      setTimeout(() => {
        addBtn.textContent = 'В корзину';
        addBtn.style.background = '#1A1A1A';
      }, 1500);
    };

    const modal = document.getElementById('product-modal-view');
    modal.style.display = 'flex';
    modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
  }
  </script>
</body>
</html>
